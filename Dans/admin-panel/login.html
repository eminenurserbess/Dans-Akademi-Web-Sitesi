<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yönetim Paneli Giriş | Vali Osman Dance Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@600;700&display=swap");

      :root {
        --primary-color: #dd5928;
        --primary-color-light: #f07047;
        --text-dark: #333;
      }

      body {
        font-family: "Montserrat", sans-serif;
        transition: background-color 0.3s ease;
      }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(221, 89, 40, 0.2) 0%, rgba(0, 0, 0, 0.7) 100%);
        z-index: -99;
      }

      .logo-container {
        animation: bounceIn 1s ease-out;
      }

      .form-card {
        animation: fadeIn 1.2s ease-out;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .title-font {
        font-family: "Poppins", sans-serif;
      }

      .input-focus:focus {
        box-shadow: 0 0 0 3px rgba(221, 89, 40, 0.3);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bounceIn {
        0% {
          transform: scale(0.3);
          opacity: 0;
        }
        50% {
          transform: scale(1.1);
        }
        80% {
          transform: scale(0.9);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .logo-img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
      }
    </style>
  </head>
  <body class="flex items-center justify-center min-h-screen p-4">
    <div class="overlay"></div>

    <!-- Giriş formu kartı -->
    <div class="form-card w-full max-w-md mx-auto p-8 rounded-2xl shadow-2xl">
      <div class="text-center mb-10 logo-container flex flex-col items-center">
        <!-- Dans akademisi logosu -->
        <h1 class="text-4xl font-bold text-[--primary-color] mt-2 tracking-wide title-font">Yönetim Paneli</h1>
      </div>
      <form action="#" method="POST" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-[--text-dark] mb-2 flex items-center">
            <i class="fas fa-envelope mr-2 text-[--primary-color]"></i>
            E-posta
          </label>
          <div class="mt-1 relative">
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              class="input-focus appearance-none block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[--primary-color] focus:border-[--primary-color] sm:text-sm transition duration-200"
              placeholder="E-posta adresinizi girin"
            />
          </div>
        </div>
        <div>
          <label for="parola" class="block text-sm font-medium text-[--text-dark] mb-2 flex items-center">
            <i class="fas fa-lock mr-2 text-[--primary-color]"></i>
            Parola
          </label>
          <div class="mt-1 relative">
            <input
              id="parola"
              name="parola"
              type="password"
              autocomplete="current-password"
              required
              class="input-focus appearance-none block w-full px-4 py-3 pr-10 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[--primary-color] focus:border-[--primary-color] sm:text-sm transition duration-200"
              placeholder="••••••••"
            />
            <button
              type="button"
              id="togglePassword"
              class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer text-gray-500 hover:text-[--primary-color] transition-colors duration-200"
            >
              <i class="far fa-eye-slash" id="passwordIcon"></i>
            </button>
          </div>
        </div>
        <div>
          <button
            type="submit"
            class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-lg font-bold text-white bg-[--primary-color] transition-all duration-300 hover:bg-[--primary-color-light] hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[--primary-color] transform hover:scale-[1.02]"
          >
            <i class="fas fa-sign-in-alt mr-2"></i>
            Giriş Yap
          </button>
        </div>
      </form>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const togglePasswordButton = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("parola");
        const passwordIcon = document.getElementById("passwordIcon");

        // Eksik olan form değişkenini burada tanımlıyoruz.
        const loginForm = document.querySelector("form");

        // Şifre gösterme/gizleme işlevi
        togglePasswordButton.addEventListener("click", () => {
          const isPasswordType = passwordInput.type === "password";
          passwordInput.type = isPasswordType ? "text" : "password";

          if (isPasswordType) {
            passwordIcon.classList.remove("fa-eye-slash");
            passwordIcon.classList.add("fa-eye");
          } else {
            passwordIcon.classList.remove("fa-eye");
            passwordIcon.classList.add("fa-eye-slash");
          }
        });

        // Form gönderildiğinde yönlendirme işlevi
        loginForm.addEventListener("submit", (event) => {
          event.preventDefault(); // Sayfanın yeniden yüklenmesini engeller

          // Yönlendirme işlemi
          window.location.href = "index.html";
        });
      });
    </script>
  </body>
</html>
